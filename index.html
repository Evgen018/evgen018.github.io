<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мастерская изображений</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f6f7f9;
    color: #1a1d21;
  }
  .card {
    max-width: 520px;
    text-align: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0;
    color: #5a6068;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e8eaed; }
    p { color: #a0a6ae; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Мастерская изображений</h1>
    <p>Здесь лежат рабочие эскизы и концепты к заявкам: логотипы, обложки, карточки товаров, миниатюры. Страница открывается по прямой ссылке, которую я отправляю заказчику.</p>
  </div>
</body>
</html>
